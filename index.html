<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大粤K线 · 建仓/平仓数据抓取</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0c12 0%,#12151e 100%);color:#e0e0e0;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}

/* Header */
.header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:#1a1d2e;border-radius:12px;margin-bottom:20px;flex-wrap:wrap;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.header h1{font-size:20px;color:#ecf0f1;text-shadow:0 0 20px rgba(255,255,255,0.1)}
.header .badge{padding:3px 10px;border-radius:20px;font-size:12px;background:#252838;color:#888}
.header .author-tag{padding:3px 12px;border-radius:20px;font-size:12px;background:rgba(240,192,64,.15);color:#f0c040;border:1px solid rgba(240,192,64,.35);font-weight:bold;letter-spacing:.5px}
.status-dot{width:10px;height:10px;border-radius:50%;background:#e74c3c;flex-shrink:0}
.status-dot.live{background:#00ff88;animation:pulse 2s infinite;box-shadow:0 0 10px rgba(0,255,136,0.5)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Remote Banner */
.banner{padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.6}
.banner.info{background:rgba(52,152,219,.15);border:1px solid #3498db;color:#5dade2}
.banner.warn{background:rgba(255,71,87,.15);border:1px solid #ff4757;color:#ff4757}
.banner a{color:#5dade2}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#1a1d2e;border-radius:10px;padding:16px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)}
.stat-card .val{font-size:26px;font-weight:bold;color:#ecf0f1}
.stat-card .lbl{font-size:12px;color:#666;margin-top:4px}
.stat-card.profit .val{color:#00ff88;text-shadow:0 0 10px rgba(0,255,136,0.3)}
.stat-card.loss .val{color:#ff4757;text-shadow:0 0 10px rgba(255,71,87,0.3)}

/* Filters */
.filters{background:#1a1d2e;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.filters h2{font-size:14px;margin-bottom:14px;color:#888}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-row label{font-size:13px;color:#888;white-space:nowrap}
.filter-row input,.filter-row select{padding:8px 12px;background:#252838;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e0e0e0;font-size:13px}
.filter-row input[type=date]{font-family:inherit}
.filter-row select{font-family:inherit}
.filter-row select option{background:#1a1d2e}
.filter-row input[type=text]{font-family:inherit}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;transition:.2s}
.btn:hover{background:linear-gradient(135deg,#5dade2,#3498db);box-shadow:0 0 15px rgba(52,152,219,0.4)}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(135deg,#00ff88,#00cc6a)}
.btn.green:hover{background:linear-gradient(135deg,#00cc6a,#00ff88)}
.btn.red{background:linear-gradient(135deg,#ff4757,#c0392b)}
.btn.red:hover{background:linear-gradient(135deg,#ff6b7a,#ff4757)}
.btn.gray{background:#252838;color:#888}
.btn.gray:hover{background:#333}
.btn.small{padding:6px 14px;font-size:13px}

/* Teacher Summary */
.teacher-summary{background:#1a1d2e;border-radius:12px;padding:20px;margin-bottom:16px;display:none;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.teacher-summary h2{font-size:14px;margin-bottom:14px;color:#888}
.teacher-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.t-card{background:#252838;border-radius:8px;padding:14px;border-left:3px solid #00ff88;box-shadow:0 4px 10px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.05)}
.t-card .t-name{font-size:15px;font-weight:bold;color:#00ff88;margin-bottom:8px;text-shadow:0 0 10px rgba(0,255,136,0.3)}
.t-card .t-row{display:flex;justify-content:space-between;font-size:12px;color:#888;padding:2px 0}
.t-card .t-row .t-val{color:#e0e0e0;font-family:monospace}
.t-card .t-row .t-val.win{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.2)}
.t-card .t-row .t-val.lose{color:#ff4757;text-shadow:0 0 8px rgba(255,71,87,0.2)}
.t-card .t-row .t-val.rate{color:#3498db}
.t-card .t-winrate{margin-top:8px;height:4px;background:#1e2130;border-radius:2px;overflow:hidden}
.t-card .t-winrate div{height:100%;background:linear-gradient(90deg,#00ff88,#00cc6a);border-radius:2px;transition:width .3s}

/* Table */
.table-wrap{background:#1a1d2e;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.toolbar{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid #252838;flex-wrap:wrap;align-items:center}
.toolbar strong{font-size:14px}
.toolbar span{font-size:13px;color:#666;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#1e2130;padding:12px 10px;text-align:left;font-size:12px;color:#888;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr{border-bottom:1px solid #1e2130;transition:background .15s}
tbody tr:hover{background:#252838}
tbody td{padding:10px 10px;vertical-align:middle;white-space:nowrap}
tbody td .dir{font-weight:bold}
tbody td .dir.空{color:#ff4757;text-shadow:0 0 8px rgba(255,71,87,0.2)}
tbody td .dir.多{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.2)}
tbody td .price{font-family:monospace;font-size:13px}
tbody td .teacher-tag{display:inline-block;padding:2px 8px;background:#252838;border-radius:4px;font-size:12px;color:#888}
tbody td .closed-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:rgba(0,255,136,.15);color:#00ff88}
tbody td .open-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:rgba(52,152,219,.15);color:#3498db}
tbody td .sl{font-family:monospace;color:#ff4757;font-size:12px}
tbody td .tp{font-family:monospace;color:#00ff88;font-size:12px}
tbody td .profit{font-family:monospace;font-weight:bold}
tbody td .profit.pos{color:#00ff88;text-shadow:0 0 10px rgba(0,255,136,0.3)}
tbody td .profit.neg{color:#ff4757;text-shadow:0 0 10px rgba(255,71,87,0.3)}
.pager{display:flex;gap:8px;padding:14px 16px;border-top:1px solid #252838;align-items:center;flex-wrap:wrap}
.pager button{padding:7px 14px;background:#252838;border:1px solid rgba(255,255,255,0.1);color:#e0e0e0;border-radius:6px;cursor:pointer;font-size:13px}
.pager button:hover{background:#333}
.pager button.active{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border-color:#3498db;box-shadow:0 0 10px rgba(52,152,219,0.3)}
.pager span{font-size:13px;color:#666;margin-left:auto}
.field-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;background:#252838;color:#666}

/* Lock Screen */
.screen-lock{position:fixed;inset:0;background:linear-gradient(135deg,#0a0c12 0%,#12151e 100%);display:flex;align-items:center;justify-content:center;z-index:999}
.screen-lock.hidden{display:none}
.lock-card{background:#1a1d2e;border-radius:16px;padding:40px 48px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.05)}
.lock-icon{font-size:48px;margin-bottom:16px}
.lock-title{font-size:22px;color:#ecf0f1;font-weight:bold;margin-bottom:6px;text-shadow:0 0 20px rgba(255,255,255,0.1)}
.lock-sub{font-size:13px;color:#666;margin-bottom:28px}
.lock-input{width:100%;padding:14px 18px;background:#252838;border:2px solid rgba(255,255,255,0.1);border-radius:10px;color:#e0e0e0;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:16px;box-sizing:border-box}
.lock-input:focus{outline:none;border-color:#3498db;box-shadow:0 0 15px rgba(52,152,219,0.3)}
.lock-btn{width:100%;padding:14px;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}
.lock-btn:hover{background:linear-gradient(135deg,#5dade2,#3498db);box-shadow:0 0 20px rgba(52,152,219,0.4)}
.lock-btn:active{transform:scale(.98)}
.lock-error{color:#ff4757;font-size:13px;margin-top:12px;min-height:20px}

/* Auto Refresh */
.autorefresh{display:flex;align-items:center;gap:8px;font-size:13px;color:#888}
.autorefresh select{padding:4px 8px;background:#252838;border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#e0e0e0;font-size:12px}
.autorefresh select option{background:#1a1d2e}
.ar-toggle{width:36px;height:20px;background:#333;border-radius:10px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.ar-toggle.on{background:#00ff88;box-shadow:0 0 10px rgba(0,255,136,0.5)}
.ar-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.ar-toggle.on::after{transform:translateX(16px)}
.ar-countdown{font-family:monospace;font-size:12px;color:#666;min-width:32px}


/* Edit Price Button */
.price-cell{display:flex;align-items:center;gap:4px}
.edit-btn{background:none;border:none;color:#00ff88;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;opacity:.5;transition:.2s}
.edit-btn:hover{opacity:1;background:rgba(0,255,136,.15)}
.edited-tag{font-size:10px;color:#e67e22;background:rgba(230,126,34,.15);padding:1px 4px;border-radius:3px;margin-left:2px}

/* Edit Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal-box{background:#1a1d2e;border-radius:16px;padding:28px 32px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.05)}
.modal-box h3{font-size:16px;color:#ecf0f1;margin-bottom:16px;text-shadow:0 0 10px rgba(255,255,255,0.1)}
.modal-box label{font-size:13px;color:#888;display:block;margin-bottom:4px}
.modal-box input{width:100%;padding:10px 14px;background:#252838;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e0e0e0;font-size:15px;font-family:monospace;box-sizing:border-box;margin-bottom:16px}
.modal-box input:focus{outline:none;border-color:#3498db;box-shadow:0 0 15px rgba(52,152,219,0.3)}
.modal-box .modal-info{font-size:12px;color:#666;margin-bottom:12px;line-height:1.6}
.modal-box .modal-info span{color:#e0e0e0}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-btns button{padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;transition:.2s}
.modal-btns .btn-save{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#fff}
.modal-btns .btn-save:hover{box-shadow:0 0 15px rgba(0,255,136,0.4)}
.modal-btns .btn-cancel{background:#252838;color:#888}
.modal-btns .btn-cancel:hover{background:#333}

/* Lottery */
.lottery-box{background:#1a1d2e;border-radius:16px;padding:24px 28px;width:720px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.05)}
.lottery-box h3{font-size:18px;color:#f0c040;margin-bottom:18px;text-align:center;text-shadow:0 0 15px rgba(240,192,64,0.4);font-weight:bold}
.lottery-wrap{display:flex;gap:24px;align-items:flex-start}
.lottery-left{position:relative;width:280px;flex-shrink:0}
#lotteryCanvas{display:block;background:#0a0c12;border-radius:50%;box-shadow:0 0 30px rgba(240,192,64,0.3),inset 0 0 20px rgba(0,0,0,0.5)}
.lottery-pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #f0c040;z-index:5;filter:drop-shadow(0 0 8px rgba(240,192,64,0.8))}
.lottery-pointer::after{content:'';position:absolute;top:-26px;left:-6px;width:12px;height:12px;background:#f0c040;border-radius:50%;box-shadow:0 0 12px #f0c040}
.lottery-btn{margin-top:16px;width:100%;padding:12px;background:linear-gradient(135deg,#f0c040,#e0a020);color:#1a1d2e;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}
.lottery-btn:hover{box-shadow:0 0 20px rgba(240,192,64,0.6);transform:translateY(-1px)}
.lottery-btn:active{transform:scale(.98)}
.lottery-btn:disabled{background:#444;color:#888;cursor:not-allowed;box-shadow:none;transform:none}
.lottery-right{flex:1;min-width:0}
.lottery-right h4{font-size:14px;color:#f0c040;margin-bottom:10px;margin-top:0}
.lottery-prize-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.lottery-prize-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#252838;border-radius:6px;font-size:13px;border-left:3px solid #888}
.lottery-prize-item.p1{border-left-color:#ffd700;background:rgba(255,215,0,0.1)}
.lottery-prize-item.p2{border-left-color:#c0c0c0;background:rgba(192,192,192,0.1)}
.lottery-prize-item.p3{border-left-color:#cd7f32;background:rgba(205,127,50,0.1)}
.lottery-prize-item.p4{border-left-color:#666}
.lottery-prize-item.p5{border-left-color:#3498db}
.lottery-prize-rank{color:#ecf0f1;font-weight:bold}
.lottery-prize-amt{color:#f0c040;font-family:monospace;font-weight:bold}
.lottery-odds{background:#0a0c12;border-radius:8px;padding:10px 12px;font-size:12px}
.lottery-odd-row{display:flex;justify-content:space-between;padding:3px 0;color:#888}
.lottery-odd-row span:last-child{color:#f0c040;font-family:monospace}
.lottery-result{margin-top:16px;padding:14px;border-radius:10px;text-align:center;font-size:15px;font-weight:bold;display:none}
.lottery-result.show{display:block;animation:resultPop .4s}
.lottery-result.win{background:linear-gradient(135deg,rgba(240,192,64,0.2),rgba(224,160,32,0.1));border:1px solid #f0c040;color:#f0c040}
.lottery-result.lose{background:rgba(102,102,102,0.15);border:1px solid #555;color:#aaa}
.lottery-result.retry{background:rgba(52,152,219,0.15);border:1px solid #3498db;color:#5dade2}
@keyframes resultPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
/* Minesweeper */
.mine-modal .modal-box{width:460px;padding:0}
#mineStatus{text-align:center;font-size:14px;color:#f0c040;margin:16px 0 12px;letter-spacing:1px}
#mineCanvas{display:block;margin:0 auto;border:1px solid #333;border-radius:4px}
.mine-info{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.mine-info .mine-stat{color:#ecf0f1;font-size:13px}
.mine-info .mine-stat span{color:#f0c040;font-weight:bold}
.mine-info .mine-btn{padding:6px 18px;background:#3498db;border:none;border-radius:6px;color:#fff;font-size:13px;cursor:pointer}
.mine-info .mine-btn:hover{background:#2980b9}
</style>
</head>
<body>

<!-- 锁屏 -->
<div class="screen-lock" id="screenLock">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <div class="lock-title">大粤K线 · 数据查看</div>
    <div class="lock-sub">输入密码解锁</div>
    <input type="password" class="lock-input" id="lockInput" placeholder="请输入密码" maxlength="20" autocomplete="off">
    <button class="lock-btn" id="lockBtn">解锁</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<!-- 数据界面 -->
<div id="screenData" style="display:none">
<div class="wrap">

  <!-- 更新提示栏 -->
  <div id="updateBar" class="banner info" style="display:none;margin-bottom:16px">
    <span id="updateMsg"></span>
    <button class="btn small green" id="btnInstall" style="margin-left:16px;display:none" onclick="doInstallUpdate()">安装更新并重启</button>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>📊 大粤K线 · 建仓/平仓数据</h1>
    <span class="author-tag">作者:cc陈</span>
    <span class="badge">房间 7000</span>
    <span class="badge" id="modeBadge">合并模式</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <button class="btn small gray" id="btnLock" title="锁屏">🔒 锁屏</button>
      <div class="autorefresh">
        <span>自动刷新</span>
        <div class="ar-toggle" id="arToggle" title="开关自动刷新"></div>
        <select id="arInterval" title="刷新间隔">
          <option value="1">1分钟</option>
          <option value="3">3分钟</option>
          <option value="5" selected>5分钟</option>
          <option value="10">10分钟</option>
        </select>
        <span class="ar-countdown" id="arCountdown"></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusTxt" style="font-size:13px;color:#888">未连接</span>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsArea" style="display:none">
    <div class="stat-card"><div class="val" id="statTotal">-</div><div class="lbl">总记录数</div></div>
    <div class="stat-card"><div class="val" id="statPage">-</div><div class="lbl">本页记录</div></div>
    <div class="stat-card"><div class="val" id="statClosed">-</div><div class="lbl">已平仓</div></div>
    <div class="stat-card"><div class="val" id="statOpen">-</div><div class="lbl">未平仓</div></div>
    <div class="stat-card"><div class="val" id="statProfit">-</div><div class="lbl">盈利记录</div></div>
    <div class="stat-card loss"><div class="val" id="statLoss">-</div><div class="lbl">亏损记录</div></div>
  </div>

  <!-- Filters -->
  <div class="filters" id="filtersArea" style="display:none">
    <h2>🔍 筛选 &amp; 工具</h2>
    <div class="filter-row">
      <label>日期从</label><input type="date" id="fStart">
      <label>至</label><input type="date" id="fEnd">
      <label>老师</label>
      <select id="fTeacher"><option value="">全部老师</option></select>
      <label>方向</label>
      <select id="fDir"><option value="">全部</option><option value="多">多</option><option value="空">空</option></select>
      <label>商品</label><input type="text" id="fProduct" placeholder="如：美黄金" style="width:120px">
      <button class="btn small green" id="btnFetch">📥 刷新本页</button>
      <button class="btn small green" id="btnFetchAll">📥 抓取全部</button>
      <button class="btn small" id="btnExport">💾 导出 CSV</button>
      <button class="btn small" id="btnLottery" style="background:linear-gradient(135deg,#f0c040,#e0a020);color:#1a1d2e;font-weight:bold">🎰 抽奖</button>
      <button class="btn small" id="btnMinesweeper" style="background:linear-gradient(135deg,#3498db,#2980b9)">🎮 小游戏</button>
    </div>
  </div>

  <!-- Teacher Summary -->
  <div class="teacher-summary" id="teacherSummary">
    <h2>👨🏫 老师盈亏汇总</h2>
    <div class="teacher-cards" id="teacherCards"></div>
  </div>

  <!-- Data Table -->
  <div class="table-wrap" id="tableArea" style="display:none">
    <div class="toolbar">
      <strong>📋 数据列表</strong>
      <button class="btn small" id="btnMode">切换：建仓提醒</button>
      <span id="tableInfo"></span>
    </div>
    <div style="overflow-x:auto">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="btnFirst">« 首页</button>
      <button id="btnPrev">‹ 上一页</button>
      <span id="pageNums"></span>
      <button id="btnNext">下一页 ›</button>
      <button id="btnLast">末页 »</button>
      <span id="pageInfo"></span>
    </div>
  </div>

</div>
</div><!-- end screenData -->

<!-- 编辑点位弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 id="editTitle">✏️ 修改</h3>
    <div class="modal-info" id="editInfo"></div>

<script>
const API = '';  // 同源代理（Electron proxy-server.js）
const ROOM_ID = 7000;

const TEACHERS = {
  4421:'大元老师', 4767:'青松老师', 3814:'山野老师',
  3154:'羽木老师', 4732:'安然老师', 4460:'泰山老师',
  3153:'大元老师', 3155:'夏美老师',
};

// 品种合约配置（与 proxy-server.js 保持一致，用于前端重算盈亏）
const CONTRACTS = {
  '小纳指': { unit: 20,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '微纳指': { unit: 2,   unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '恒指':   { unit: 50,  unitCcy: 'HKD', rate: 1.00, priceDiv: 1    },
  '美原油': { unit: 10,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '美黄金': { unit: 10,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '黄金':   { unit: 10,  unitCcy: 'CNY', rate: 7.98, priceDiv: 1    },
  '小道指': { unit: 10,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '美精铜': { unit: 12.5,unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '德指':   { unit: 25,  unitCcy: 'EUR', rate: 9.10, priceDiv: 1    },
  '小德指': { unit: 5,   unitCcy: 'EUR', rate: 9.10, priceDiv: 1    },
};

const COLS = [
  {key:'openTime',  label:'开仓时间',  w:'160'},
  {key:'direction', label:'方向',      w:'55'},
  {key:'product',   label:'商品',      w:'100'},
  {key:'openPrice', label:'开仓点位',  w:'100'},
  {key:'stopLoss',  label:'止损',     w:'100', cls:'sl'},
  {key:'takeProfit',label:'止盈',     w:'130', cls:'tp'},
  {key:'closeTime', label:'平仓时间',  w:'160'},
  {key:'closePrice',label:'平仓点位',  w:'100'},
  {key:'profitPts', label:'获利点数',  w:'90',  cls:'profit'},
  {key:'profitAmt', label:'盈亏金额',  w:'90',  cls:'profit'},
  {key:'teacher',   label:'老师',      w:'90'},
  {key:'status',    label:'状态',      w:'70'},
];

// State
let allRows = [];
let filteredRows = [];
let page = 1;
const PAGE_SIZE = 20;
let currentMode = 'merged';
let isFetching = false;

// === API helper ===
async function api(path, method, body) {
  const r = await fetch(API + path, {
    method: method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

// === Render head ===
function renderHead() {
  document.getElementById('tableHead').innerHTML = '<tr>' + COLS.map(c =>
    `<th style="width:${c.w}px">${c.label}</th>`
  ).join('') + '</tr>';
}

// === Render table body ===
function renderTable(rows) {
  const start = (page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  document.getElementById('tableBody').innerHTML = pageRows.map((row, i) => {
    const bg = i % 2 === 0 ? '' : 'style="background:#1c1f2d"';
    return '<tr ' + bg + '>' + COLS.map(c => {
      let val = row[c.key] !== undefined ? row[c.key] : '';
      const cls = c.cls || '';
      const title = val ? ` title="${val}"` : '';
      if (c.key === 'direction') return `<td><span class="dir ${val}">${val}</span></td>`;
      if (c.key === 'openPrice' || c.key === 'closePrice') {
        const edited = row['_edited_' + c.key];
        return `<td><div class="price-cell"><span class="price">${val}</span>${edited ? '<span class="edited-tag">已改</span>' : ''}<button class="edit-btn" onclick="openEditModal(${start+i},'${c.key}')" title="修改点位">✏️</button></div></td>`;
      }
      if (c.key === 'stopLoss' || c.key === 'takeProfit') {
        return `<td><span class="price${cls?' '+cls:''}">${val}</span></td>`;
      }
      if (c.key === 'profitPts') {
        const edited = row['_orig_profitPts'];
        const p = parseFloat(val);
        const cls = isNaN(p) ? '' : (p > 0 ? 'pos' : p < 0 ? 'neg' : '');
        return `<td><div class="price-cell"><span class="profit ${cls}">${val}</span>${edited ? '<span class="edited-tag">已改</span>' : ''}<button class="edit-btn" onclick="openEditModal(${start+i},'${c.key}')" title="修改">✏️</button></div></td>`;
      }
      if (c.key === 'profitAmt') {
        const edited = row['_orig_profitAmt'];
        const p = parseFloat(val.replace('¥','').replace('+',''));
        const cls = isNaN(p) ? '' : (p > 0 ? 'pos' : p < 0 ? 'neg' : '');
        return `<td><div class="price-cell"><span class="profit ${cls}">${val}</span>${edited ? '<span class="edited-tag">已改</span>' : ''}</div></td>`;
      }
      if (c.key === 'teacher') return `<td><span class="teacher-tag">${val}</span></td>`;
      if (c.key === 'status') {
        return row.isClosed
          ? `<td><span class="closed-badge">已平仓</span></td>`
          : `<td><span class="open-badge">未平仓</span></td>`;
      }
      return `<td${title} style="max-width:${c.w}px;overflow:hidden;text-overflow:ellipsis">${val}</td>`;
    }).join('') + '</tr>';
  }).join('');
  document.getElementById('tableInfo').textContent =
    `共 ${rows.length} 条 | 第 ${Math.min(start+1,rows.length)}-${Math.min(start+PAGE_SIZE,rows.length)} 条`;
}

// === Stats ===
function updateStats(rows) {
  document.getElementById('statTotal').textContent = rows.length;
  document.getElementById('statPage').textContent = rows.length > 0
    ? `${(page-1)*PAGE_SIZE+1}-${Math.min(page*PAGE_SIZE,rows.length)}` : 0;
  const closed = rows.filter(r=>r.isClosed).length;
  document.getElementById('statClosed').textContent = closed;
  document.getElementById('statOpen').textContent = rows.length - closed;
  const profitRows = rows.filter(r=>r.profitPts && parseFloat(r.profitPts)>0);
  const lossRows   = rows.filter(r=>r.profitPts && parseFloat(r.profitPts)<0);
  document.getElementById('statProfit').textContent = profitRows.length;
  document.getElementById('statLoss').textContent   = lossRows.length;
}

// === Pager ===
function renderPager(rows) {
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const nums = document.getElementById('pageNums');
  let html = '';
  for (let p = Math.max(1,page-2); p <= Math.min(totalPages,page+2); p++) {
    html += `<button class="${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  nums.innerHTML = html;
  document.getElementById('pageInfo').textContent = `第 ${page} / ${totalPages} 页`;
}

function goPage(p) {
  const totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
  page = Math.max(1, Math.min(p, totalPages));
  renderTable(filteredRows);
  renderPager(filteredRows);
}

// === Teacher Summary ===
function updateTeacherSummary(rows) {
  const map = {};
  rows.forEach(r => {
    if (!r.teacher) return;
    if (!map[r.teacher]) map[r.teacher] = {
      name:r.teacher, total:0, wins:0, losses:0, open:0, unknown:0,
      profitAmt:0, winAmt:0, lossAmt:0
    };
    const t = map[r.teacher];
    t.total++;
    if (r.isClosed) {
      if (r.profitPts && r.profitPts !== '') {
        const pts = parseFloat(r.profitPts);
        if (!isNaN(pts)) {
          if (pts > 0) { t.wins++; t.winAmt += pts; }
          else if (pts < 0) { t.losses++; t.lossAmt += Math.abs(pts); }
        } else { t.unknown++; }
      } else { t.unknown++; }
      if (r.profitAmt && r.profitAmt !== '未知品种') {
        const amt = parseFloat(r.profitAmt.replace(/[¥+,]/g,''));
        if (!isNaN(amt)) t.profitAmt += amt;
      }
    } else { t.open++; }
  });

  const teachers = Object.values(map).sort((a,b)=>b.profitAmt-a.profitAmt);
  if (!teachers.length) { document.getElementById('teacherSummary').style.display='none'; return; }
  document.getElementById('teacherSummary').style.display='block';
  document.getElementById('teacherCards').innerHTML = teachers.map(t => {
    const closed = t.wins + t.losses;
    const winRate = closed > 0 ? (t.wins/closed*100).toFixed(1) : '-';
    const amtStr  = t.profitAmt >= 0 ? `+${t.profitAmt.toFixed(0)}` : t.profitAmt.toFixed(0);
    const barW    = closed > 0 ? (t.wins/closed*100) : 0;
    const checked = t.wins + t.losses + t.open + t.unknown;
    const diff    = t.total - checked;
    const avgWin  = t.wins > 0 ? t.winAmt/t.wins : 0;
    const avgLoss = t.losses > 0 ? t.lossAmt/t.losses : 0;
    const rr = avgLoss > 0 ? (avgWin/avgLoss).toFixed(1) : (t.wins>0?'∞':'-');
    return `<div class="t-card">
      <div class="t-name">${t.name}</div>
      <div class="t-row"><span>总喊单</span><span class="t-val">${t.total}</span></div>
      <div class="t-row"><span>盈利</span><span class="t-val win">${t.wins}</span></div>
      <div class="t-row"><span>亏损</span><span class="t-val lose">${t.losses}</span></div>
      <div class="t-row"><span>持仓中</span><span class="t-val">${t.open}</span></div>
      ${t.unknown > 0 ? `<div class="t-row"><span>未知</span><span class="t-val" style="color:#e67e22">${t.unknown}</span></div>` : ''}
      ${diff !== 0 ? `<div class="t-row"><span style="color:#e74c3c">⚠️差${Math.abs(diff)}单</span><span class="t-val"></span></div>` : ''}
      <div class="t-row"><span>胜率</span><span class="t-val rate">${winRate}%</span></div>
      <div class="t-row"><span>盈亏比</span><span class="t-val rate">${rr}</span></div>
      <div class="t-row"><span>总盈亏</span><span class="t-val ${t.profitAmt>=0?'win':'lose'}">¥${amtStr}</span></div>
      <div class="t-winrate"><div style="width:${barW}%"></div></div>
    </div>`;
  }).join('');
}

// === Apply filters ===
function applyFilters() {
  const startD = document.getElementById('fStart').value;
  const endD   = document.getElementById('fEnd').value;
  const teacher = document.getElementById('fTeacher').value;
  const dir    = document.getElementById('fDir').value;
  const product= document.getElementById('fProduct').value.trim();

  filteredRows = allRows.filter(row => {
    if (startD) {
      const p = row.openTime.split(' ')[0].split('/');
      const d = `${p[0]}-${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}`;
      if (d < startD) return false;
    }
    if (endD) {
      const p = row.openTime.split(' ')[0].split('/');
      const d = `${p[0]}-${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}`;
      if (d > endD) return false;
    }
    if (teacher && row.teacher !== teacher) return false;
    if (dir && row.direction !== dir) return false;
    if (product && !row.product.includes(product)) return false;
    return true;
  });

  page = 1;
  renderTable(filteredRows);
  renderPager(filteredRows);
  updateStats(filteredRows);
  updateTeacherSummary(filteredRows);
}



// === Edit Price Modal ===
let editRowIdx = -1;
let editField = '';

function openEditModal(idx, field) {
  const row = filteredRows[idx];
  if (!row) return;
  editRowIdx = idx;
  editField = field;
  const label = field === 'openPrice' ? '开仓点位' : field === 'closePrice' ? '平仓点位' : field === 'profitPts' ? '获利点数' : field === 'profitAmt' ? '盈亏金额' : '点位';
  document.getElementById('editTitle').textContent = '✏️ 修改' + label;
  document.getElementById('editLabel').textContent = label;
  const current = row[field] || '';
  document.getElementById('editInput').value = current;
  document.getElementById('editInfo').innerHTML =
    `<span>${row.product}</span> · <span>${row.direction}</span> · <span>${row.teacher || '-'}</span><br>` +
    `当前${label}：<span>${current || '(空)'}</span>` +
    (field === 'closePrice' && row.openPrice ? ` · 开仓点位：<span>${row.openPrice}</span>` : '') +
    (field === 'openPrice' && row.closePrice ? ` · 平仓点位：<span>${row.closePrice}</span>` : '') +
    (field === 'profitAmt' && row.profitPts ? ` · 获利点数：<span>${row.profitPts}</span>` : '');
  document.getElementById('editModal').classList.add('show');
  setTimeout(() => document.getElementById('editInput').focus(), 100);
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editRowIdx = -1;
  editField = '';
}

function saveEdit() {
  if (editRowIdx < 0) return;
  const row = filteredRows[editRowIdx];
  const newVal = document.getElementById('editInput').value.trim();
  if (!newVal) return;
  
  // 开仓点位 / 平仓点位：直接保存，不触发计算
  if (editField === 'openPrice' || editField === 'closePrice') {
    const backupKey = '_orig_' + editField;
    if (!row[backupKey]) row[backupKey] = row[editField];
    row[editField] = newVal;
    row['_edited_' + editField] = true;
  // 获利点数：保存并计算盈亏金额
  } else if (editField === 'profitPts') {
    if (!row['_orig_profitPts']) row['_orig_profitPts'] = row['profitPts'];
    row['profitPts'] = newVal;
    row['_edited_profitPts'] = true;
    const cv = CONTRACTS[row.product] || {};
    if (cv.unit) {
      const pts = parseFloat(newVal.replace('+', ''));
      const amount = pts * cv.unit * cv.rate;
      const amtStr = amount.toFixed(0);
      row['profitAmt'] = amount >= 0 ? (amount > 0 ? '+¥' + amtStr : '¥0') : '¥' + amtStr;
    }
  // 盈亏金额：直接保存，不重新计算
  } else if (editField === 'profitAmt') {
    const backupKey = '_orig_' + editField;
    if (!row[backupKey]) row[backupKey] = row[editField];
    row[editField] = newVal;
    row['_edited_' + editField] = true;
  }
  
  const origIdx = allRows.indexOf(row);
  if (origIdx >= 0) { allRows[origIdx] = row; }
  closeEditModal();
  renderTable(filteredRows);
  updateStats(filteredRows);
  updateTeacherSummary(filteredRows);
}

function recalcProfit(row) {
  const cv = CONTRACTS[row.product] || {};
  const div = cv.priceDiv || 1;
  const o = parseFloat(row.openPrice) / div;
  const c = parseFloat(row.closePrice) / div;
  if (!isNaN(o) && !isNaN(c) && c !== 0) {
    let pts = 0;
    if (row.direction === '多') pts = c - o;
    else if (row.direction === '空') pts = o - c;
    row.profitPts = pts > 0 ? '+' + pts.toFixed(2) : pts.toFixed(2);
    if (cv.unit) {
      // 直接相乘：获利点数 × 每点价值 × 汇率
      const amount = pts * cv.unit * cv.rate;
      const amtStr = amount.toFixed(0);
      row.profitAmt = amount >= 0 ? (amount > 0 ? '+¥' + amtStr : '¥0') : '¥' + amtStr;
    } else {
      row.profitAmt = '未知品种';
    }
  }
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('editModal').classList.contains('show')) return;
  if (e.key === 'Escape') closeEditModal();
  if (e.key === 'Enter') saveEdit();
});

// === Fetch ===
async function doFetch(forceAll) {
  if (isFetching) return;
  if (!forceAll && allRows.length > 0) { applyFilters(); return; }

  isFetching = true;
  const btn  = document.getElementById('btnFetchAll');
  const orig = btn.textContent;
  btn.textContent = '⏳ 抓取中...';
  btn.disabled = true;

  try {
    const filters = {};
    const s = document.getElementById('fStart').value;
    const e = document.getElementById('fEnd').value;
    if (s) filters.pt = s.replace(/-/g,'/');
    if (e) filters.et = e.replace(/-/g,'/');

    const r = await api('/fetch', 'POST', { mode: currentMode, filters });
    if (!r.ok) throw new Error(r.error || (r.authError ? '请先解锁' : '抓取失败'));

    allRows = r.rows || [];
    filteredRows = [...allRows];
    page = 1;

    renderTable(filteredRows);
    renderPager(filteredRows);
    updateStats(filteredRows);
    updateTeacherSummary(filteredRows);

    document.getElementById('statsArea').style.display = 'grid';
    document.getElementById('filtersArea').style.display = 'block';
    document.getElementById('tableArea').style.display = 'block';
  } catch(e) {
    alert('抓取失败：' + e.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
    isFetching = false;
  }
}

// === Export CSV ===
function exportCSV() {
  if (!filteredRows.length) { alert('没有数据可导出'); return; }
  const header = COLS.map(c=>c.label).join(',');
  const rows = filteredRows.map(row =>
    COLS.map(c => {
      let v = (row[c.key] !== undefined ? row[c.key] : '');
      if (String(v).includes(',')||String(v).includes('"')||String(v).includes('\n'))
        v = '"' + String(v).replace(/"/g,'""') + '"';
      return v;
    }).join(',')
  );
  const csv = '\uFEFF' + [header, ...rows].join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8-sig'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `大粤K线_合并_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

  { name: '二等奖',   amount: '¥6',      prob: 0,    color: '#c0c0c0', textColor: '#1a1d2e' },
  { name: '三等奖',   amount: '¥0.6',    prob: 0,    color: '#cd7f32', textColor: '#fff'    },
  { name: '谢谢惠顾', amount: '再来一次', prob: 50,   color: '#555555', textColor: '#fff'    },
  { name: '再抽一次', amount: '免费再抽', prob: 50,   color: '#3498db', textColor: '#fff'    },
];
let lotterySpinning = false;
let lotteryCurrentAngle = 0;

function drawLotteryWheel(angle) {
  const canvas = document.getElementById('lotteryCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 8;
  const n = LOTTERY_PRIZES.length;
  const arc = (Math.PI * 2) / n;
  // 12 点钟方向 = -PI/2
  const startBase = -Math.PI / 2;

  ctx.clearRect(0, 0, W, H);

  // 绘制扇区
  for (let i = 0; i < n; i++) {
    const start = startBase + angle + i * arc;
    const end   = start + arc;
    const p = LOTTERY_PRIZES[i];
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    // 扇区边框
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 文字
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc/2);
    ctx.textAlign = 'center';
    ctx.fillStyle = p.textColor;
    ctx.font = 'bold 14px Microsoft YaHei';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 3;
    ctx.fillText(p.name, r * 0.62, 0);
    ctx.shadowBlur = 0;
    ctx.font = '11px Microsoft YaHei';
    ctx.fillText(p.amount, r * 0.62, 16);
    ctx.restore();
  }

  // 外圈装饰
  ctx.beginPath();
  ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
  ctx.strokeStyle = '#f0c040';
  ctx.lineWidth = 4;
  ctx.stroke();

  // 内圈装饰
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1d2e';
  ctx.fill();
  ctx.strokeStyle = '#f0c040';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#f0c040';
  ctx.font = 'bold 14px Microsoft YaHei';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('GO', cx, cy);
}

function openLottery() {
  document.getElementById('lotteryModal').classList.add('show');
  document.getElementById('lotteryResult').className = 'lottery-result';
  document.getElementById('lotteryResult').textContent = '';
  drawLotteryWheel(lotteryCurrentAngle * Math.PI / 180);
}

function closeLottery() {
  document.getElementById('lotteryModal').classList.remove('show');
}

function doLotteryDraw() {
  if (lotterySpinning) return;
  lotterySpinning = true;
  const btn = document.getElementById('lotteryDrawBtn');
  btn.disabled = true;
  btn.textContent = '抽奖中...';

  // 根据概率抽取奖项
  const r = Math.random() * 100;
  let acc = 0;
  let pickIdx = LOTTERY_PRIZES.length - 1; // 默认最后一项（兑底防止全部 prob=0/累加不命中）
  for (let i = 0; i < LOTTERY_PRIZES.length; i++) {
    acc += LOTTERY_PRIZES[i].prob;
    if (r < acc) { pickIdx = i; break; }
  }

  // 目标角度计算：让 pickIdx 扇区落在 12 点钟方向
  // 当前绘制逻辑：扇区 i 的中心 = startBase(-PI/2) + angle + i*arc + arc/2
  // 我们希望该角度 = -PI/2 + (2k+1)PI (指向 12 点), 即扇区中心对准顶部
  // 简单计算：targetAngle = -(pickIdx + 0.5) * 360 / n
  const n = LOTTERY_PRIZES.length;
  const degPerSector = 360 / n;
  // 让选中扇区中心指向 12 点所需的总角度（转盘上）
  const targetAngleDeg = -(pickIdx + 0.5) * degPerSector;
  // 当前角度（转盘上）
  const currentAngleDeg = ((lotteryCurrentAngle % 360) + 360) % 360;
  // 计算需要旋转的增量（以使其指向 12 点），加 5-8 圈
  let diff = (targetAngleDeg - currentAngleDeg);
  // 归一化到 [0, 360)
  diff = ((diff % 360) + 360) % 360;
  const totalSpin = 360 * (5 + Math.random() * 3) + diff;
  const newAngle = lotteryCurrentAngle + totalSpin;

  // 动画
  const duration = 4500;
  const startTime = performance.now();
  const startAngle = lotteryCurrentAngle;

  function animate(now) {
    const t = Math.min(1, (now - startTime) / duration);
    // easeOutCubic
    const eased = 1 - Math.pow(1 - t, 3);
    lotteryCurrentAngle = startAngle + totalSpin * eased;
    drawLotteryWheel(lotteryCurrentAngle * Math.PI / 180);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      // 完成
      lotterySpinning = false;
      btn.disabled = false;
      btn.textContent = '再抽一次';
      showLotteryResult(pickIdx);
    }
  }
  requestAnimationFrame(animate);
}

function showLotteryResult(idx) {
  const p = LOTTERY_PRIZES[idx];
  const el = document.getElementById('lotteryResult');
  el.className = 'lottery-result show';
  if (p.name === '一等奖' || p.name === '二等奖' || p.name === '三等奖') {
    el.classList.add('win');
    el.innerHTML = `🎉 恭喜中奖！<br>获得 <b>${p.name}</b> - ${p.amount}`;
  } else if (p.name === '谢谢惠顾') {
    el.classList.add('lose');
    el.innerHTML = `😢 ${p.name}<br><span style="font-size:13px;font-weight:normal">${p.amount}</span>`;
  } else {
    el.classList.add('retry');
    el.innerHTML = `🔄 ${p.name}！<br><span style="font-size:13px;font-weight:normal">${p.amount}</span>`;
  }
}

// === Minesweeper ===
let mBoard = [], mRevealed = [], mFlagged = [], mRows = 9, mCols = 9, mMines = 10, mGameOver = false, mWon = false, mFirstClick = true, mTimerInterval = null, mSeconds = 0;

function initMinesweeper() {
  mBoard = []; mRevealed = []; mFlagged = []; mGameOver = false; mWon = false; mFirstClick = true; mSeconds = 0;
  clearInterval(mTimerInterval); mTimerInterval = null;
  for (let r = 0; r < mRows; r++) { mBoard[r] = []; mRevealed[r] = []; mFlagged[r] = []; for (let c = 0; c < mCols; c++) { mBoard[r][c] = 0; mRevealed[r][c] = false; mFlagged[r][c] = false; } }
  let placed = 0;
  while (placed < mMines) { const r = Math.floor(Math.random() * mRows), c = Math.floor(Math.random() * mCols); if (mBoard[r][c] !== -1) { mBoard[r][c] = -1; placed++; } }
  for (let r = 0; r < mRows; r++) for (let c = 0; c < mCols; c++) if (mBoard[r][c] !== -1) { let cnt = 0; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const nr = r+dr, nc = c+dc; if (nr>=0&&nr<mRows&&nc>=0&&nc<mCols&&mBoard[nr][nc]===-1) cnt++; } mBoard[r][c] = cnt; }
  if (mTimerInterval) clearInterval(mTimerInterval);
  document.getElementById('mineStatus').textContent = '💣 剩余雷数：' + mMines;
  document.getElementById('mineTimer').textContent = '0';
  document.getElementById('mineFlagCount').textContent = '0';
  drawMines();
}

function drawMines() {
  const canvas = document.getElementById('mineCanvas');
  const ctx = canvas.getContext('2d');
  const cellSize = canvas.width / mCols;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 白底
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const numColors = {1:'#3498db',2:'#27ae60',3:'#e74c3c',4:'#8e44ad',5:'#c0392b',6:'#16a085',7:'#2c3e50',8:'#7f8c8d'};
  for (let r = 0; r < mRows; r++) {
    for (let c = 0; c < mCols; c++) {
      const x = c * cellSize, y = r * cellSize;
      // 格子黑线框
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cellSize - 1, cellSize - 1);
      // 未揭开的格子：浅灰底
      if (!mRevealed[r][c] && !mGameOver) {
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(x+1, y+1, cellSize-2, cellSize-2);
      }
      if (mRevealed[r][c]) {
        // 揭开的格子：白底
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x+1, y+1, cellSize-2, cellSize-2);
        if (mBoard[r][c] === -1) {
          // 雷：红色圆
          ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(x+cellSize/2, y+cellSize/2, cellSize*0.28, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2; ctx.stroke();
        } else if (mBoard[r][c] > 0) {
          // 数字
          ctx.fillStyle = numColors[mBoard[r][c]] || '#000';
          ctx.font = 'bold ' + (cellSize * 0.52) + 'px monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(mBoard[r][c], x+cellSize/2, y+cellSize/2);
        }
      }
      if (mFlagged[r][c]) {
        // 旗
        ctx.font = (cellSize * 0.55) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🚩', x+cellSize/2, y+cellSize/2);
      }
      if (mGameOver && mBoard[r][c] === -1 && !mFlagged[r][c]) {
        // 游戏结束时显示未标记的雷
        ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(x+cellSize/2, y+cellSize/2, cellSize*0.28, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  }
  // Win check
  let revealedCount = 0;
  for (let r = 0; r < mRows; r++) for (let c = 0; c < mCols; c++) if (mRevealed[r][c]) revealedCount++;
  if (revealedCount === mRows * mCols - mMines) {
    mGameOver = true; mWon = true;
    document.getElementById('mineStatus').textContent = '🎉 恭喜胜利！用时 ' + mSeconds + ' 秒';
  }
}

function reveal(r, c) {
  if (mGameOver || mRevealed[r][c] || mFlagged[r][c]) return;
  if (mFirstClick) {
    // First click never a mine — regenerate if needed
    if (mBoard[r][c] === -1) {
      mBoard[r][c] = 0;
      let placed = 0;
      while (placed < 1) {
        const nr = Math.floor(Math.random() * mRows), nc = Math.floor(Math.random() * mCols);
        if (!(nr === r && nc === c) && mBoard[nr][nc] !== -1) { mBoard[nr][nc] = -1; placed++; }
      }
      for (let i = 0; i < mRows; i++) for (let j = 0; j < mCols; j++) if (mBoard[i][j] !== -1) {
        let cnt = 0; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const nr = i+dr, nc = j+dc; if (nr>=0&&nr<mRows&&nc>=0&&nc<mCols&&mBoard[nr][nc]===-1) cnt++;
        } mBoard[i][j] = cnt;
      }
    }
    mFirstClick = false;
    mTimerInterval = setInterval(() => { mSeconds++; document.getElementById('mineTimer').textContent = mSeconds; }, 1000);
  }
  mRevealed[r][c] = true;
  if (mBoard[r][c] === -1) {
    mGameOver = true; clearInterval(mTimerInterval);
    // Reveal all mines
    for (let i = 0; i < mRows; i++) for (let j = 0; j < mCols; j++) if (mBoard[i][j] === -1) mRevealed[i][j] = true;
    document.getElementById('mineStatus').textContent = '💥 踩雷了！游戏结束';
    drawMines(); return;
  }
  if (mBoard[r][c] === 0) for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const nr = r+dr, nc = c+dc; if (nr>=0&&nr<mRows&&nc>=0&&nc<mCols) reveal(nr, nc); }
  drawMines();
}

function toggleFlag(e) {
  e.preventDefault();
  const canvas = document.getElementById('mineCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX, y = (e.clientY - rect.top) * scaleY;
  const cellSize = canvas.width / mCols;
  const c = Math.floor(x / cellSize), r = Math.floor(y / cellSize);
  if (r<0||r>=mRows||c<0||c>=mCols||mRevealed[r][c]||mGameOver) return;
  mFlagged[r][c] = !mFlagged[r][c];
  let flagCount = 0;
  for (let i = 0; i < mRows; i++) for (let j = 0; j < mCols; j++) if (mFlagged[i][j]) flagCount++;
  document.getElementById('mineFlagCount').textContent = flagCount;
  document.getElementById('mineStatus').textContent = '💣 剩余雷数：' + (mMines - flagCount);
  drawMines();
}

function openMine() {
  document.getElementById('mineModal').style.display = 'flex';
  initMinesweeper();
  const canvas = document.getElementById('mineCanvas');
  canvas.onclick = function(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX, y = (e.clientY - rect.top) * scaleY;
    const cellSize = canvas.width / mCols;
    reveal(Math.floor(y / cellSize), Math.floor(x / cellSize));
  };
  canvas.oncontextmenu = toggleFlag;
}

function closeMine() {
  clearInterval(mTimerInterval);
  document.getElementById('mineModal').style.display = 'none';
}

// === Load teachers filter ===
async function loadTeachers() {
  try {
    const r = await api('/teachers');
    const sel = document.getElementById('fTeacher');
    Object.values(r).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

// === Auto Refresh ===
let arTimer = null, arCdTimer = null, arLeft = 0;

function startAR() {
  stopAR();
  const min = parseInt(document.getElementById('arInterval').value);
  arLeft = min * 60;
  arTimer = setInterval(() => { allRows=[]; doFetch(true); arLeft = min*60; }, min*60000);
  arCdTimer = setInterval(() => {
    arLeft--;
    const m = Math.floor(arLeft/60), s = arLeft%60;
    document.getElementById('arCountdown').textContent = `${m}:${String(s).padStart(2,'0')}`;
  }, 1000);
  document.getElementById('arToggle').classList.add('on');
  document.getElementById('arCountdown').textContent = `${min}:00`;
}

function stopAR() {
  if (arTimer) { clearInterval(arTimer); arTimer=null; }
  if (arCdTimer) { clearInterval(arCdTimer); arCdTimer=null; }
  document.getElementById('arToggle').classList.remove('on');
  document.getElementById('arCountdown').textContent = '';
}

// === Remote config banner ===
let _bannerLoaded = false;
async function loadRemoteBanner() {
  if (_bannerLoaded) return;
  _bannerLoaded = true;
  try {
    const cfg = await api('/config');
    if (cfg.latestVersion && cfg.currentVersion && cfg.latestVersion !== cfg.currentVersion) {
      const url = cfg.updateUrl || 'https://github.com/Bluemelancholy1/trading-scraper/releases';
      showBanner('info', `🆕 新版本 v${cfg.latestVersion}（当前 v${cfg.currentVersion}），<a href="${url}" target="_blank" style="color:#5dade2">点击下载</a>`);
    }
    if (cfg.message) showBanner('warn', cfg.message);
  } catch(e) {}
}

function showBanner(type, html) {
  const el = document.createElement('div');
  el.className = 'banner ' + type;
  el.innerHTML = html;
  document.querySelector('.wrap').prepend(el);
}

// === Lock / Unlock ===
async function doUnlock() {
  const pw = document.getElementById('lockInput').value;
  if (!pw) { document.getElementById('lockError').textContent = '请输入密码'; return; }
  try {
    const r = await api('/unlock', 'POST', { password: pw });
    if (r.ok) {
      document.getElementById('lockInput').value = '';
      document.getElementById('lockError').textContent = '';
      showDataScreen();
      loadRemoteBanner();
      await autoLogin();
      await doFetch(false);
    } else if (r.disabled) {
      document.getElementById('lockError').textContent = '该应用已被停用，请联系管理员';
    } else {
      document.getElementById('lockError').textContent = r.error || '密码错误';
    }
  } catch(e) {
    document.getElementById('lockError').textContent = '连接失败，请确认服务已启动';
  }
}

function showLockScreen() {
  document.getElementById('screenLock').classList.remove('hidden');
  document.getElementById('screenData').style.display = 'none';
}

function showDataScreen() {
  document.getElementById('screenLock').classList.add('hidden');
  document.getElementById('screenData').style.display = '';
}

// === Init ===
async function init() {
  const today = new Date().toISOString().slice(0,10);
  const weekAgo = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  document.getElementById('fEnd').value = today;
  document.getElementById('fStart').value = weekAgo;

  renderHead();
  loadTeachers();

  try {
    const r = await api('/status');
    if (r.appReady) {
      showDataScreen();
      loadRemoteBanner();
      if (!r.loggedIn) await autoLogin();
      await doFetch(false);
    } else {
      showLockScreen();
    }
  } catch(e) {
    showLockScreen();
  }
}

document.getElementById('btnFetchAll').onclick = () => doFetch(true);

document.getElementById('btnLottery').onclick   = openLottery;

});

  if (e.key === 'Escape' && document.getElementById('lotteryModal').classList.contains('show')) closeLottery();
});
document.getElementById('btnFirst').onclick     = () => goPage(1);
document.getElementById('btnPrev').onclick      = () => goPage(page-1);
document.getElementById('btnNext').onclick      = () => goPage(page+1);
document.getElementById('btnLast').onclick      = () => goPage(9999);
document.getElementById('lockBtn').onclick      = doUnlock;
document.getElementById('lockInput').onkeydown  = e => { if(e.key==='Enter') doUnlock(); };
document.getElementById('btnLock').onclick      = async () => { await api('/lock','GET'); showLockScreen(); };

document.getElementById('arToggle').onclick = function() {
  this.classList.contains('on') ? stopAR() : startAR();
};
document.getElementById('arInterval').onchange = function() {
  if (document.getElementById('arToggle').classList.contains('on')) startAR();
};

document.getElementById('btnMode').onclick = function() {

// === Auto Update ===
let pendingVersion = null;

function doInstallUpdate() {
  if (window.electronAPI) window.electronAPI.installUpdate();
}

if (window.electronAPI) {
  window.electronAPI.onUpdateStatus((data) => {
    const bar = document.getElementById('updateBar');
    const msg = document.getElementById('updateMsg');
    const btn = document.getElementById('btnInstall');
    if (!bar || !msg) return;

    if (data.status === 'available') {
      bar.style.display = 'flex';
      bar.className = 'banner info';
      msg.textContent = `🆕 发现新版本 v${data.version}，正在后台下载...`;
      btn.style.display = 'none';
      pendingVersion = data.version;
    } else if (data.status === 'downloading') {
      bar.style.display = 'flex';
      bar.className = 'banner info';
      msg.textContent = `📥 正在下载更新... ${data.progress}%`;
      btn.style.display = 'none';
    } else if (data.status === 'ready') {
      bar.style.display = 'flex';
      bar.className = 'banner info';
      msg.textContent = `✅ 新版本 v${data.version} 下载完成！`;
      btn.style.display = 'inline-flex';
    } else if (data.status === 'error') {
      bar.style.display = 'flex';
      bar.className = 'banner warn';
      msg.textContent = `⚠️ 更新检查失败：${data.error}`;
      btn.style.display = 'none';
    } else if (data.status === 'up-to-date') {
      bar.style.display = 'none';
    }
  });
}
