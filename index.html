<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大粤K线 · 建仓/平仓数据抓取</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0c12 0%,#12151e 100%);color:#e0e0e0;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}

/* Header */
.header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:#1a1d2e;border-radius:12px;margin-bottom:20px;flex-wrap:wrap;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.header h1{font-size:20px;color:#ecf0f1;text-shadow:0 0 20px rgba(255,255,255,0.1)}
.header .badge{padding:3px 10px;border-radius:20px;font-size:12px;background:#252838;color:#aaa}
.status-dot{width:10px;height:10px;border-radius:50%;background:#e74c3c;flex-shrink:0}
.status-dot.live{background:#00ff88;animation:pulse 2s infinite;box-shadow:0 0 10px rgba(0,255,136,0.5)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Remote Banner */
.banner{padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.6}
.banner.info{background:rgba(52,152,219,.15);border:1px solid #3498db;color:#5dade2}
.banner.warn{background:rgba(255,71,87,.15);border:1px solid #ff4757;color:#ff4757}
.banner a{color:#5dade2}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#1a1d2e;border-radius:10px;padding:16px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)}
.stat-card .val{font-size:26px;font-weight:bold;color:#ecf0f1}
.stat-card .lbl{font-size:12px;color:#999;margin-top:4px}
.stat-card.profit .val{color:#00ff88;text-shadow:0 0 10px rgba(0,255,136,0.3)}
.stat-card.loss .val{color:#ff4757;text-shadow:0 0 10px rgba(255,71,87,0.3)}

/* Filters */
.filters{background:#1a1d2e;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.filters h2{font-size:14px;margin-bottom:14px;color:#aaa}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-row label{font-size:13px;color:#aaa;white-space:nowrap}
.filter-row input,.filter-row select{padding:8px 12px;background:#252838;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e0e0e0;font-size:13px}
.filter-row input[type=date]{font-family:inherit}
.filter-row select{font-family:inherit}
.filter-row select option{background:#1a1d2e}
.filter-row input[type=text]{font-family:inherit}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;transition:.2s}
.btn:hover{background:linear-gradient(135deg,#5dade2,#3498db);box-shadow:0 0 15px rgba(52,152,219,0.4)}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(135deg,#00ff88,#00cc6a)}
.btn.green:hover{background:linear-gradient(135deg,#00cc6a,#00ff88)}
.btn.red{background:linear-gradient(135deg,#ff4757,#c0392b)}
.btn.red:hover{background:linear-gradient(135deg,#ff6b7a,#ff4757)}
.btn.gray{background:#252838;color:#888}
.btn.gray:hover{background:#333}
.btn.small{padding:6px 14px;font-size:13px}

/* Teacher Summary */
.teacher-summary{background:#1a1d2e;border-radius:12px;padding:20px;margin-bottom:16px;display:none;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.teacher-summary h2{font-size:14px;margin-bottom:14px;color:#aaa}
.teacher-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.t-card{background:#252838;border-radius:8px;padding:14px;border-left:3px solid #00ff88;box-shadow:0 4px 10px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.05)}
.t-card .t-name{font-size:15px;font-weight:bold;color:#00ff88;margin-bottom:8px;text-shadow:0 0 10px rgba(0,255,136,0.3)}
.t-card .t-row{display:flex;justify-content:space-between;font-size:12px;color:#aaa;padding:2px 0}
.t-card .t-row .t-val{color:#e0e0e0;font-family:monospace}
.t-card .t-row .t-val.win{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.2)}
.t-card .t-row .t-val.lose{color:#ff4757;text-shadow:0 0 8px rgba(255,71,87,0.2)}
.t-card .t-row .t-val.rate{color:#3498db}
.t-card .t-winrate{margin-top:8px;height:4px;background:#1e2130;border-radius:2px;overflow:hidden}
.t-card .t-winrate div{height:100%;background:linear-gradient(90deg,#00ff88,#00cc6a);border-radius:2px;transition:width .3s}

/* Table */
.table-wrap{background:#1a1d2e;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.toolbar{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid #252838;flex-wrap:wrap;align-items:center}
.toolbar strong{font-size:14px}
.toolbar span{font-size:13px;color:#999;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#1e2130;padding:12px 10px;text-align:left;font-size:12px;color:#aaa;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr{border-bottom:1px solid #1e2130;transition:background .15s}
tbody tr:hover{background:#252838}
tbody td{padding:10px 10px;vertical-align:middle;white-space:nowrap}
tbody td .dir{font-weight:bold}
tbody td .dir.空{color:#ff4757;text-shadow:0 0 8px rgba(255,71,87,0.2)}
tbody td .dir.多{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.2)}
tbody td .price{font-family:monospace;font-size:13px}
tbody td .teacher-tag{display:inline-block;padding:2px 8px;background:#252838;border-radius:4px;font-size:12px;color:#888}
tbody td .closed-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:rgba(0,255,136,.15);color:#00ff88}
tbody td .open-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:rgba(52,152,219,.15);color:#3498db}
tbody td .sl{font-family:monospace;color:#ff4757;font-size:12px}
tbody td .tp{font-family:monospace;color:#00ff88;font-size:12px}
tbody td .profit{font-family:monospace;font-weight:bold}
tbody td .profit.pos{color:#00ff88;text-shadow:0 0 10px rgba(0,255,136,0.3)}
tbody td .profit.neg{color:#ff4757;text-shadow:0 0 10px rgba(255,71,87,0.3)}
.pager{display:flex;gap:8px;padding:14px 16px;border-top:1px solid #252838;align-items:center;flex-wrap:wrap}
.pager button{padding:7px 14px;background:#252838;border:1px solid rgba(255,255,255,0.1);color:#e0e0e0;border-radius:6px;cursor:pointer;font-size:13px}
.pager button:hover{background:#333}
.pager button.active{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border-color:#3498db;box-shadow:0 0 10px rgba(52,152,219,0.3)}
.pager span{font-size:13px;color:#666;margin-left:auto}
.field-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;background:#252838;color:#aaa}

/* Lock Screen */
.screen-lock{position:fixed;inset:0;background:linear-gradient(135deg,#0a0c12 0%,#12151e 100%);display:flex;align-items:center;justify-content:center;z-index:999}
.screen-lock.hidden{display:none}
.lock-card{background:#1a1d2e;border-radius:16px;padding:40px 48px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.05)}
.lock-icon{font-size:48px;margin-bottom:16px}
.lock-title{font-size:22px;color:#ecf0f1;font-weight:bold;margin-bottom:6px;text-shadow:0 0 20px rgba(255,255,255,0.1)}
.lock-sub{font-size:13px;color:#666;margin-bottom:28px}
.lock-input{width:100%;padding:14px 18px;background:#252838;border:2px solid rgba(255,255,255,0.1);border-radius:10px;color:#e0e0e0;font-size:16px;text-align:center;letter-spacing:4px;margin-bottom:16px;box-sizing:border-box}
.lock-input:focus{outline:none;border-color:#3498db;box-shadow:0 0 15px rgba(52,152,219,0.3)}
.lock-btn{width:100%;padding:14px;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}
.lock-btn:hover{background:linear-gradient(135deg,#5dade2,#3498db);box-shadow:0 0 20px rgba(52,152,219,0.4)}
.lock-btn:active{transform:scale(.98)}
.lock-error{color:#ff4757;font-size:13px;margin-top:12px;min-height:20px}

/* Auto Refresh */
.autorefresh{display:flex;align-items:center;gap:8px;font-size:13px;color:#aaa}
.autorefresh select{padding:4px 8px;background:#252838;border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#e0e0e0;font-size:12px}
.autorefresh select option{background:#1a1d2e}
.ar-toggle{width:36px;height:20px;background:#333;border-radius:10px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.ar-toggle.on{background:#00ff88;box-shadow:0 0 10px rgba(0,255,136,0.5)}
.ar-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.ar-toggle.on::after{transform:translateX(16px)}
.ar-countdown{font-family:monospace;font-size:12px;color:#666;min-width:32px}


/* Edit Price Button */
.price-cell{display:flex;align-items:center;gap:4px}
.edit-btn{background:none;border:none;color:#00ff88;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;opacity:.5;transition:.2s}
.edit-btn:hover{opacity:1;background:rgba(0,255,136,.15)}
.edited-tag{font-size:10px;color:#e67e22;background:rgba(230,126,34,.15);padding:1px 4px;border-radius:3px;margin-left:2px}

/* Edit Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal-box{background:#1a1d2e;border-radius:16px;padding:28px 32px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.05)}
.modal-box h3{font-size:16px;color:#ecf0f1;margin-bottom:16px;text-shadow:0 0 10px rgba(255,255,255,0.1)}
.modal-box label{font-size:13px;color:#888;display:block;margin-bottom:4px}
.modal-box input{width:100%;padding:10px 14px;background:#252838;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e0e0e0;font-size:15px;font-family:monospace;box-sizing:border-box;margin-bottom:16px}
.modal-box input:focus{outline:none;border-color:#3498db;box-shadow:0 0 15px rgba(52,152,219,0.3)}
.modal-box .modal-info{font-size:12px;color:#666;margin-bottom:12px;line-height:1.6}
.modal-box .modal-info span{color:#e0e0e0}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-btns button{padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;transition:.2s}
.modal-btns .btn-save{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#fff}
.modal-btns .btn-save:hover{box-shadow:0 0 15px rgba(0,255,136,0.4)}
.modal-btns .btn-cancel{background:#252838;color:#888}
.modal-btns .btn-cancel:hover{background:#333}
</style>
</head>
<body>

<!-- 锁屏 -->
<div class="screen-lock" id="screenLock">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <div class="lock-title">大粤K线 · 数据查看</div>
    <div class="lock-sub">输入密码解锁</div>
    <input type="password" class="lock-input" id="lockInput" placeholder="请输入密码" maxlength="20" autocomplete="off">
    <button class="lock-btn" id="lockBtn" onclick="handleUnlock()">解锁</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<!-- 数据界面 -->
<div id="screenData" style="display:none">
<div class="wrap">

  <!-- 更新提示栏 -->
  <div id="updateBar" class="banner info" style="display:none;margin-bottom:16px">
    <span id="updateMsg"></span>
    <button class="btn small green" id="btnInstall" style="margin-left:16px;display:none" onclick="doInstallUpdate()">安装更新并重启</button>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>📊 大粤K线 · 建仓/平仓数据</h1>
    <span class="badge">房间 7000</span>
    <span class="badge" id="modeBadge">合并模式</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      <button class="btn small gray" id="btnLock" title="锁屏">🔒 锁屏</button>
      <div class="autorefresh">
        <span>自动刷新</span>
        <div class="ar-toggle" id="arToggle" title="开关自动刷新"></div>
        <select id="arInterval" title="刷新间隔">
          <option value="1">1分钟</option>
          <option value="3">3分钟</option>
          <option value="5" selected>5分钟</option>
          <option value="10">10分钟</option>
        </select>
        <span class="ar-countdown" id="arCountdown"></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusTxt" style="font-size:13px;color:#888">未连接</span>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsArea" style="display:none">
    <div class="stat-card"><div class="val" id="statTotal">-</div><div class="lbl">总记录数</div></div>
    <div class="stat-card"><div class="val" id="statPage">-</div><div class="lbl">本页记录</div></div>
    <div class="stat-card"><div class="val" id="statClosed">-</div><div class="lbl">已平仓</div></div>
    <div class="stat-card"><div class="val" id="statOpen">-</div><div class="lbl">未平仓</div></div>
    <div class="stat-card"><div class="val" id="statProfit">-</div><div class="lbl">盈利记录</div></div>
    <div class="stat-card loss"><div class="val" id="statLoss">-</div><div class="lbl">亏损记录</div></div>
  </div>

  <!-- Filters -->
  <div class="filters" id="filtersArea" style="display:none">
    <h2>🔍 筛选 &amp; 工具</h2>
    <div class="filter-row">
      <label>日期从</label><input type="date" id="fStart">
      <label>至</label><input type="date" id="fEnd">
      <label>老师</label>
      <select id="fTeacher"><option value="">全部老师</option></select>
      <label>方向</label>
      <select id="fDir"><option value="">全部</option><option value="多">多</option><option value="空">空</option></select>
      <label>商品</label><input type="text" id="fProduct" placeholder="如：美黄金" style="width:120px">
      <button class="btn small green" id="btnFetch">📥 刷新本页</button>
      <button class="btn small green" id="btnFetchAll">📥 抓取全部</button>
      <button class="btn small" id="btnExport">💾 导出 CSV</button>
    </div>
  </div>

  <!-- Teacher Summary -->
  <div class="teacher-summary" id="teacherSummary">
    <h2>👨🏫 老师盈亏汇总</h2>
    <div class="teacher-cards" id="teacherCards"></div>
  </div>

  <!-- Data Table -->
  <div class="table-wrap" id="tableArea" style="display:none">
    <div class="toolbar">
      <strong>📋 数据列表</strong>
      <button class="btn small" id="btnMode">切换：建仓提醒</button>
      <span id="tableInfo"></span>
    </div>
    <div style="overflow-x:auto">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="btnFirst">« 首页</button>
      <button id="btnPrev">‹ 上一页</button>
      <span id="pageNums"></span>
      <button id="btnNext">下一页 ›</button>
      <button id="btnLast">末页 »</button>
      <span id="pageInfo"></span>
    </div>
  </div>

</div>
</div><!-- end screenData -->

<!-- 编辑点位弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <h3 id="editTitle">✏️ 修改</h3>
    <div class="modal-info" id="editInfo"></div>
    <label id="editLabel">点位</label>
    <input type="text" id="editInput" placeholder="输入新的点位数值" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEditModal()">取消</button>
      <button class="btn-save" onclick="saveEdit()">确认修改</button>
    </div>
  </div>
</div>


<script>
const API = '';  // 同源代理（Electron proxy-server.js）
const ROOM_ID = 7000;

const TEACHERS = {
  4421:'大元老师', 4767:'青松老师', 3814:'山野老师',
  3154:'羽木老师', 4732:'安然老师', 4460:'泰山老师',
  3153:'大元老师', 3155:'夏美老师',
};

// 品种合约配置（与 proxy-server.js 保持一致，用于前端重算盈亏）
const CONTRACTS = {
  '小纳指': { unit: 20,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '微纳指': { unit: 2,   unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '恒指':   { unit: 50,  unitCcy: 'HKD', rate: 1.00, priceDiv: 1    },
  '美原油': { unit: 10,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '美黄金': { unit: 10,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '黄金':   { unit: 10,  unitCcy: 'CNY', rate: 7.98, priceDiv: 1    },
  '小道指': { unit: 10,  unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '美精铜': { unit: 12.5,unitCcy: 'USD', rate: 7.98, priceDiv: 1    },
  '德指':   { unit: 25,  unitCcy: 'EUR', rate: 9.10, priceDiv: 1    },
  '小德指': { unit: 5,   unitCcy: 'EUR', rate: 9.10, priceDiv: 1    },
};

const COLS = [
  {key:'openTime',  label:'开仓时间',  w:'160'},
  {key:'direction', label:'方向',      w:'55'},
  {key:'product',   label:'商品',      w:'100'},
  {key:'openPrice', label:'开仓点位',  w:'100'},
  {key:'stopLoss',  label:'止损',     w:'100', cls:'sl'},
  {key:'takeProfit',label:'止盈',     w:'130', cls:'tp'},
  {key:'closeTime', label:'平仓时间',  w:'160'},
  {key:'closePrice',label:'平仓点位',  w:'100'},
  {key:'profitPts', label:'获利点数',  w:'90',  cls:'profit'},
  {key:'profitAmt', label:'盈亏金额',  w:'90',  cls:'profit'},
  {key:'teacher',   label:'老师',      w:'90'},
  {key:'status',    label:'状态',      w:'70'},
];

// State
let allRows = [];
let filteredRows = [];
let page = 1;
const PAGE_SIZE = 20;
let currentMode = 'merged';
let isFetching = false;

// === API helper ===
async function api(path, method, body) {
  try {
    const r = await fetch(API + path, {
      method: method || 'GET',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    return await r.json();
  } catch (err) {
    console.error('API错误:', err);
    throw err;
  }
}

// === Render head ===
function handleUnlock() {
  const pwd = document.getElementById('lockInput').value;
  if (!pwd) return alert('请输入密码');
  api('/unlock', 'POST', {password: pwd}).then(res => {
    if (res.ok) {
      document.getElementById('screenLock').style.display = 'none';
      loadData();
    } else {
      alert('密码错误');
    }
  }).catch(err => {
    console.error('解锁失败:', err);
    alert('连接失败，请刷新页面重试');
  });
}

function renderHead() {
  document.getElementById('tableHead').innerHTML = '<tr>' + COLS.map(c =>
    `<th style="width:${c.w}px">${c.label}</th>`
  ).join('') + '</tr>';
}

// === Render table body ===
function renderTable(rows) {
  const start = (page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  document.getElementById('tableBody').innerHTML = pageRows.map((row, i) => {
    const bg = i % 2 === 0 ? '' : 'style="background:#1c1f2d"';
    return '<tr ' + bg + '>' + COLS.map(c => {
      let val = row[c.key] !== undefined ? row[c.key] : '';
      const cls = c.cls || '';
      const title = val ? ` title="${val}"` : '';
      if (c.key === 'direction') return `<td><span class="dir ${val}">${val==='多'?'✓ ':val==='空'?'✗ ':''}${val}</span></td>`;
      if (c.key === 'openPrice' || c.key === 'closePrice') {
        const edited = row['_edited_' + c.key];
        return `<td><div class="price-cell"><span class="price">${val}</span>${edited ? '<span class="edited-tag">已改</span>' : ''}<button class="edit-btn" onclick="openEditModal(${start+i},'${c.key}')" title="修改点位">✏️</button></div></td>`;
      }
      if (c.key === 'stopLoss' || c.key === 'takeProfit') {
        return `<td><span class="price${cls?' '+cls:''}">${val}</span></td>`;
      }
      if (c.key === 'profitPts') {
        const edited = row['_orig_profitPts'];
        const p = parseFloat(val);
        const cls = isNaN(p) ? '' : (p > 0 ? 'pos' : p < 0 ? 'neg' : '');
        const prefix = isNaN(p) ? '' : (p > 0 ? '✓ ' : p < 0 ? '✗ ' : '');
        return `<td><div class="price-cell"><span class="profit ${cls}">${prefix}${val}</span>${edited ? '<span class="edited-tag">已改</span>' : ''}<button class="edit-btn" onclick="openEditModal(${start+i},'${c.key}')" title="修改">✏️</button></div></td>`;
      }
      if (c.key === 'profitAmt') {
        const edited = row['_orig_profitAmt'];
        const p = parseFloat(val.replace('¥','').replace('+',''));
        const cls = isNaN(p) ? '' : (p > 0 ? 'pos' : p < 0 ? 'neg' : '');
        return `<td><div class="price-cell"><span class="profit ${cls}">${val}</span>${edited ? '<span class="edited-tag">已改</span>' : ''}</div></td>`;
      }
      if (c.key === 'teacher') return `<td><span class="teacher-tag">${val}</span></td>`;
      if (c.key === 'status') {
        return row.isClosed
          ? `<td><span class="closed-badge">已平仓</span></td>`
          : `<td><span class="open-badge">未平仓</span></td>`;
      }
      return `<td${title} style="max-width:${c.w}px;overflow:hidden;text-overflow:ellipsis">${val}</td>`;
    }).join('') + '</tr>';
  }).join('');
  document.getElementById('tableInfo').textContent =
    `共 ${rows.length} 条 | 第 ${Math.min(start+1,rows.length)}-${Math.min(start+PAGE_SIZE,rows.length)} 条`;
}

// === Stats ===
function updateStats(rows) {
  document.getElementById('statTotal').textContent = rows.length;
  document.getElementById('statPage').textContent = rows.length > 0
    ? `${(page-1)*PAGE_SIZE+1}-${Math.min(page*PAGE_SIZE,rows.length)}` : 0;
  const closed = rows.filter(r=>r.isClosed).length;
  document.getElementById('statClosed').textContent = closed;
  document.getElementById('statOpen').textContent = rows.length - closed;
  const profitRows = rows.filter(r=>r.profitPts && parseFloat(r.profitPts)>0);
  const lossRows   = rows.filter(r=>r.profitPts && parseFloat(r.profitPts)<0);
  document.getElementById('statProfit').textContent = profitRows.length;
  document.getElementById('statLoss').textContent   = lossRows.length;
}

// === Pager ===
function renderPager(rows) {
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const nums = document.getElementById('pageNums');
